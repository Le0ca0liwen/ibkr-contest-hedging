# Instructor contest; deliberately incomplete and non-executable until the
# account, report source and IBKR conIds are filled in from the broker.
name: SPCX RKLB SPY contest
account: null
environment: paper
# Day 0 (Wed Oct 21) sets up the portfolio and is the scoring baseline.
day_zero: 2026-10-21
# Days 1-10. Mon Oct 26 accrues interest for Sat/Sun (n_i = 3).
scoring_sessions:
  - 2026-10-22
  - 2026-10-23
  - 2026-10-26
  - 2026-10-27
  - 2026-10-28
  - 2026-10-29
  - 2026-10-30
  - 2026-11-02
  - 2026-11-03
  - 2026-11-04
valuation_convention: IBKR official closing account NAV
report_source: null
confirmed: false
contest_rules: spcx_rklb_spy
# The handout's "November 21, 2025" is last year's date; the "Nov 20" legs
# expire Friday 2026-11-20 (third Friday). Verify against IBKR contract details.
contest_option_expiry: 2026-11-20
# Score = sum |V_i - (1 + r/360)^n_i * V_(i-1)|, n_i = calendar days since the
# previous session.
scoring_rule: calendar_interest_benchmark
scoring_annual_rate: 0.0344
# Forecast the cash interest the account accrues (ACT/360), so the optimizer
# expects NAV to grow toward the (1 + r/360)^n target instead of staying flat.
policy:
  cash_rate: 0.0344
  cash_rate_status: modeled
  cash_rate_source: "Contest rules: cash balance earns nominal r ~ 3.44%"
contracts: []
# Insert verified conIds with signed quantities (all Nov 20 2026, multiplier 100):
# SPCX calls 130 / 145 / 160:  +25 / -50 / +25   (call butterfly)
# RKLB puts 45 / 55:           -25 / +25         (bear put spread)
# SPY call and put 770:        +25 / +25         (straddle)
# Also define SPCX, RKLB and SPY stock contracts as the option underlyings.
mandatory: {}
# open: every defined contract except the mandated legs and forbidden
# instruments (SPY shares, Nov 20 RKLB calls, other Nov 20 SPY options) is
# tradable. Define candidates with read-only discovery, e.g.
#   python -m hedge.cli expand-universe --config CONFIG --symbols IVV VOO \
#     --option-symbols SPCX RKLB SPY --expiries 2 --strikes 6 --output OUT.yaml
universe: open
