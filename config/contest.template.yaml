# Instructor contest; deliberately incomplete and non-executable until the
# account, report source and IBKR conIds are filled in from the broker.
# The updated instructor table confirms November 20 and the strikes below.
name: SPCX RKLB SPY contest
account: null
environment: paper
# Day 0 (Wed Oct 21) sets up the portfolio and is the scoring baseline.
day_zero: 2026-10-21
# Days 1-10. Mon Oct 26 accrues interest for Sat/Sun (n_i = 3).
scoring_sessions:
  - 2026-10-22
  - 2026-10-23
  - 2026-10-26
  - 2026-10-27
  - 2026-10-28
  - 2026-10-29
  - 2026-10-30
  - 2026-11-02
  - 2026-11-03
  - 2026-11-04
valuation_convention: IBKR official closing account NAV
report_source: null
confirmed: false
contest_rules: spcx_rklb_spy
# IBKR supplies no live quotes to this team: all quotes, books and history come
# from Moomoo OpenD (quote-only, never trades). IBKR stays the only broker.
market_data_provider: moomoo
# Joint daily closes for every underlying (SPY is required for beta even though
# its shares are forbidden). Re-fetch before EACH open; the service reloads the
# file when it changes and waits (instead of trading) if it is over 7 days old:
#   .runtime/moomoo-env/bin/python ops/fetch_moomoo_daily.py \
#     --symbols SPCX RKLB SPY IVV VOO --as-of <today> --output data/moomoo/daily-contest.csv
daily_stock_history: data/moomoo/daily-contest.csv
# Moomoo provides no borrow data, so new stock shorts are disabled unless you
# record verified shortable shares here (check IBKR's short availability first):
# stock_borrow: {SPCX: 2000, RKLB: 2000, IVV: 2000}
# stock_borrow_source: "IBKR short stock availability, checked 2026-10-21 09:15"
# Scenario IV shocks move against spot (leverage effect): rho = -0.7 for broad
# index ETFs (SPY, IVV, VOO, SPLG, QQQ, IWM, DIA), -0.4 for other symbols.
# Override per symbol, each within [-0.95, 0.5]:
# spot_vol_correlation: {SPCX: -0.3, RKLB: -0.3}
# Every risk limit scales with min(initial_nav, current NAV). Set this to the
# verified IBKR Day 0 NAV; leaving the $1M default caps limits at $1M.
initial_nav: "1000000"
# The handout's "November 21, 2025" is last year's date; the "Nov 20" legs
# expire Friday 2026-11-20 (third Friday). Verify against IBKR contract details.
contest_option_expiry: 2026-11-20
# Score = sum |V_i - (1 + r/360)^n_i * V_(i-1)|, n_i = calendar days since the
# previous session.
scoring_rule: calendar_interest_benchmark
scoring_annual_rate: 0.0344
# Forecast the cash interest the account accrues (ACT/360), so the optimizer
# expects NAV to grow toward the (1 + r/360)^n target instead of staying flat.
policy:
  # Accept a hedge certified within $20 of the modeled optimum (the trade threshold is >= $100).
  # The $1 default often cannot be proven inside the 10 s solver budget.
  primary_band: 20
  # Re-optimize options every 2 minutes instead of 15. In replays of the Oct 8-21 sessions this
  # cut the mean daily |miss| by about $150 for about $20/day more trading cost.
  option_seconds: 120
  cash_rate: 0.0344
  cash_rate_status: modeled
  cash_rate_source: "Contest rules: cash balance earns nominal r ~ 3.44%"
  # true: costs sit inside |closing gap - costs|, so a NAV surplus is partly spent by trading
  # all day; false: costs are an additive penalty. Decisions record burn_component. The contest
  # spends a surplus only near the close (see `burner` below), so all-day burning stays off.
  burn_surplus: false
  # Weight on the modeled close -> next session open + 15 min gap (straddle decay, overnight
  # moves); 0 disables. See docs/OPTIMIZER_RUNTIME.md.
  overnight_weight: 0.5
# Start paper trading automatically after launch, once the mandated book is held and every paper
# activation check passes (the same checks as "Enable paper trading"). The dashboard's
# "Auto paper" switch overrides this; Pause trading stops it. Launch with Start Contest.command.
autostart: paper
# Closing surplus burner (docs/CLOSING_BURNER.md): spends a NAV surplus only near the close (never
# on Day 0). The contest scores the IBKR statement NAV, fixed by the 16:00 closing marks while
# post-market trades still book to the day, so here it works after the close (16:16-19:56 ET)
# against the predicted statement NAV, through buy-then-sell round trips in SPCX/RKLB shares (DAY
# limits the burner cancels after 3 s, since IBKR takes no IOC outside regular hours). shadow records
# what it would do and sends nothing; paper trades when the app is also in paper. The dashboard
# switch can downgrade it (paper -> shadow -> off) at any time.
# An enabled burner requires policy.burn_surplus: false.
burner:
  mode: paper                       # off | shadow | paper
  admissibility_source: "Instructor: deliberate expense through ordinary trades not disallowed (operator confirmed 2026-10-21)"
  symbols: [SPCX, RKLB]             # allowlisted stocks only (never SPY)
  quantities: [1, 5, 10, 25, 50, 100, 200]
  max_shares: 200
  option_burn: false                # 1..option_max_contracts round trips in non-mandated options
  option_max_contracts: 5
  option_max_spread: 0.20
  window_minutes: 20                # active from close - 20 min (unused in the contest: 16:16 ET on)
  stock_entry_cutoff_minutes: 4     # >= stock_cutoff_minutes + 2 so every exit fits
  option_entry_cutoff_minutes: 17   # >= option_cutoff_minutes + 2
  start_threshold: 25               # USD hysteresis on the closing gap quantile below
  stop_threshold: 5
  spend_quantile: 0.4               # spend toward this gap quantile (0.5 = median); lower = safer
  require_pnl_stream: true          # act only on the settled 1-second NAV (never fill attribution)
  settle_seconds: 8                 # after each cycle, let fills and fees reach the NAV stream
  bias: 0                           # signed model-vs-official bias; needs bias_source if nonzero
  bias_source: ""
  jit_headroom: 0.5                 # <= 1; lower starts burning earlier
  jit_reserve_minutes: 1
  assumed_cycle_seconds: 20         # minimum; today's measured mean only lengthens it
  minimum_improvement: 0.25
  daily_expense_cap: null           # optional USD cap on realized burn per session
  max_cycles_per_day: 300
  max_exit_attempts: 4
  exit_collar_ticks: [0, 1, 2, 5]
  quote_age_seconds: 3
contracts: []
# Insert verified conIds with signed quantities (all Nov 20 2026, multiplier 100),
# e.g. with `python -m hedge.cli prepare-contest`. Validation requires exactly
# these confirmed strikes and signs:
# SPCX calls 130 / 145 / 160:  +25 / -50 / +25   (call butterfly)
# RKLB puts 45 / 55:           -25 / +25         (bear put spread)
# SPY call and put 770:        +25 / +25         (straddle)
# Also define SPCX, RKLB and SPY stock contracts as the option underlyings.
mandatory: {}
# open: every defined contract except the mandated legs and forbidden
# instruments (SPY shares, Nov 20 RKLB calls, other Nov 20 SPY options) is
# tradable. Define candidates with read-only discovery, e.g.
#   python -m hedge.cli expand-universe --config CONFIG \
#     --option-symbols SPCX RKLB SPY --expiries 2 --strikes 1 --output OUT.yaml
# Keep the universe small (~12 tradable): the 10 s solver and the 5 s scenario
# freshness check fail on ~40 candidates, and scanned peers did not improve hedges.
# Discovery takes the expiries nearest Nov 20 on both sides (SPY Nov 19/23 etc.).
# Then regenerate the Moomoo collector list and restart the service:
#   python -m hedge.cli moomoo-codes --config OUT.yaml
universe: open
