[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "contest-hedge"
version = "0.1.0"
description = "Deterministic IBKR paper contest hedging, scoring, and supervision"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi", "uvicorn", "pydantic>=2", "PyYAML", "SQLAlchemy>=2", "alembic",
  "psycopg[binary]", "numpy", "pandas", "pyarrow", "cvxpy", "highspy", "osqp",
  "QuantLib", "ib_async", "exchange_calendars", "httpx", "anthropic>=2"
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[project.scripts]
hedge = "hedge.cli:main"
hedge-surplus = "surplus_addon.__main__:main"

[tool.setuptools.packages.find]
include = ["hedge*", "surplus_addon*"]

[tool.setuptools.package-data]
hedge = ["web/*"]
surplus_addon = ["web/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]
